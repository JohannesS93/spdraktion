services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Expose DB only on the VM loopback so it is reachable via SSH tunnel,
    # but not publicly accessible.
    ports:
      - "127.0.0.1:5432:5432/tcp"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
    restart: unless-stopped
    env_file:
      - path: ${MAIL_IMPORT_ENV_FILE:-./secrets/webmaster-imap.env}
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FIREBASE_CRED_PATH: ${FIREBASE_CRED_PATH:-/run/secrets/firebase-adminsdk.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-spd-fraktion-intern}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
      - ${FIREBASE_SECRET_FILE:-./secrets/firebase-adminsdk.json}:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      db:
        condition: service_healthy

  admin_web:
    build:
      context: ../admin_web
      args:
        NEXT_PUBLIC_API_BASE: https://${API_DOMAIN}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://${API_DOMAIN}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      PGADMIN_DOMAIN: ${PGADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin_web
      - api
      - pgadmin

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
